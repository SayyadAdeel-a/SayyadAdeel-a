  <g text-anchor="middle">
    <text x="640" y="320" class="title-text">Hey, I’m Adeel!</text>
    <text x="640" y="382" class="subtitle-1">Jack of all trades, master of none.</text>
    <text x="640" y="428" class="subtitle-2">Still learning the art of everything...</text>
    <text x="640" y="468" class="tiny-note">curious mind • learning by building • from Pakistan</text>
  </g>

