<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Adeel's GitHub profile banner</title>
  <desc id="description">A light GitHub banner with a hanging charcoal spider, centered introduction text, subtle geometric doodles, and a clean personal aesthetic.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#ebe7df"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="50%" cy="18%" r="52%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .spider-sway {
        transform-box: view-box;
        transform-origin: 640px 0px;
        animation: spider-sway 5.8s cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      @keyframes spider-sway {
        0%, 100% { transform: rotate(-1.4deg); }
        50% { transform: rotate(1.4deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .spider-sway { animation: none; }
      }

      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #1f2328;
      }

      .title-text {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-style: italic;
        font-weight: 700;
        fill: #1c2025;
        letter-spacing: -1.5px;
      }

      .subtitle-1 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 30px;
        font-weight: 500;
        fill: #2d333b;
      }

      .subtitle-2 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 400;
        fill: #525a63;
      }

      .tiny-note {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #454d56;
        opacity: 0.88;
      }

      .doodle {
        fill: none;
        stroke: #1f2328;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.12;
      }

      .soft-doodle {
        fill: none;
        stroke: #1f2328;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.18;
      }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glowTop)"/>

  <g transform="translate(502 14)">
    <rect x="0" y="0" width="276" height="38" rx="19" fill="#dde2e7" opacity="0.98"/>
    <text x="138" y="25" text-anchor="middle" class="label">Adeel's corner · light mode</text>
  </g>

